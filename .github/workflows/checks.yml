# 항상 도는 검사(build_ci §5.4): 의존 그래프(cargo xtask deps-check), cargo deny, cargo fmt --check(바뀐 crate만)
# 영향 범위와 관계없이 develop으로 가는 PR과 develop 푸시마다 돈다(build_ci §5.1)
name: checks

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read

# PR은 새 푸시가 오면 앞 실행을 취소한다. develop 푸시는 커밋마다 끝까지 검사한다(연속 머지에서 앞 커밋이 빠지지 않게)
concurrency:
  group: checks-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  deps-check:
    name: deps-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # rust-toolchain.toml의 툴체인을 설치한다
      - run: rustup toolchain install
      # target/은 Cargo.lock 해시별로 캐시하고, develop 푸시에서만 저장한다(build_ci §5.5)
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name == 'push' }}
      - run: cargo xtask deps-check
      # 허용 표 대조 로직의 단위 테스트(위반을 일부러 넣은 경우 포함)
      - run: cargo test -p xtask

  cargo-deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check

  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    steps:
      # 바뀐 crate를 구하려면 이력이 필요하다(merge-base, 푸시 전 커밋)
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: rustup toolchain install
      # 바뀐 crate만 검사한다(build_ci §5.4). 전체를 돌리는 경로가 바뀌면 --all로 검사한다
      - run: cargo xtask affected --event "${{ github.event_name == 'push' && 'push' || 'pr' }}" --base-ref "origin/${{ github.base_ref || 'develop' }}" --before "${{ github.event_name == 'push' && github.event.before || '' }}" --fmt
