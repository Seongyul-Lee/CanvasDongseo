# cargo deny 설정 — 라이선스·취약점·금지 crate·출처 검사(build_ci §5.4)
# 실행: cargo deny check

[graph]
# 배포 대상 OS의 의존만 본다(platform §3)
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
]
all-features = true

[advisories]
# RustSec 권고(취약점·유지보수 중단·yanked)를 오류로 본다. 예외는 사유와 함께 ignore에 적는다
ignore = []

[licenses]
# 허용 라이선스. 새 라이선스가 필요하면 사유를 PR에 적고 더한다
allow = [
    "Apache-2.0",
    "MIT",
]
confidence-threshold = 0.9

[licenses.private]
# 워크스페이스 crate는 배포하지 않으므로(publish = false) 라이선스 검사에서 뺀다
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# 워크스페이스 내부 경로 의존(publish = false)은 버전 없이 쓴다
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
